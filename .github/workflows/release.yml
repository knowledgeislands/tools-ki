name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release tag (for example v1.2.3)
        required: true
        type: string

# The workflow must be dispatched from the protected default branch. The protected
# `release` environment further restricts publishing to that branch and scopes the
# signing-key secret to the publisher. The active solo-maintainer baseline has no
# required reviewer; enable that protection when an independent maintainer joins.
permissions:
  contents: read

jobs:
  validate:
    name: Validate requested release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag-commit: ${{ steps.release.outputs.tag-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            printf 'ki release: dispatch this workflow from the protected default branch\n' >&2
            exit 2
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ki release: version must be an exact v-prefixed semantic version\n' >&2
            exit 2
          fi
          git fetch --no-tags origin "refs/tags/$REQUESTED_VERSION:refs/tags/$REQUESTED_VERSION"
          tag_commit=$(git rev-parse --verify "$REQUESTED_VERSION^{commit}")
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag-commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    name: ${{ matrix.asset-target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun-target: bun-linux-x64
            asset-target: linux-x64
          - os: macos-latest
            bun-target: bun-darwin-x64
            asset-target: darwin-x64
          - os: macos-14
            bun-target: bun-darwin-arm64
            asset-target: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag-commit }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - if: matrix.asset-target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: bun install --frozen-lockfile
      - run: bun run test
      - if: matrix.asset-target == 'linux-x64'
        run: bun run test:coverage
      - run: release/package.sh "${{ needs.validate.outputs.version }}" "${{ matrix.bun-target }}" "${{ matrix.asset-target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset-target }}
          path: dist/ki-${{ needs.validate.outputs.version }}-${{ matrix.asset-target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, package]
    name: Sign and publish ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-latest
    # Configure this protected environment to allow only the protected default
    # branch and disallow bypass. Add an independent required reviewer only when
    # the repository has another trusted maintainer.
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release-assets
          merge-multiple: true
      - name: Create draft release, manifest, and signature
        env:
          GH_TOKEN: ${{ github.token }}
          KI_RELEASE_SIGNING_KEY: ${{ secrets.KI_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          release_dir=dist/release-assets
          signing_key=$(mktemp)
          derived_public_key=$(mktemp)
          trap 'rm -f "$signing_key" "$derived_public_key"' EXIT
          test -n "$KI_RELEASE_SIGNING_KEY"
          for target in darwin-arm64 darwin-x64 linux-x64; do
            asset="ki-${VERSION}-${target}.tar.gz"
            test -f "$release_dir/$asset"
          done
          test "$(find "$release_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 3
          manifest="$release_dir/ki-checksums.txt"
          {
            printf 'format=ki-release-checksums-v1\n'
            printf 'version=%s\n' "$VERSION"
            (
              cd "$release_dir"
              shasum -a 256 -- ki-"$VERSION"-darwin-arm64.tar.gz ki-"$VERSION"-darwin-x64.tar.gz ki-"$VERSION"-linux-x64.tar.gz | LC_ALL=C sort -k 2
            )
          } > "$manifest"
          printf '%s\n' "$KI_RELEASE_SIGNING_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$derived_public_key"
          diff -u release/ki-release-signing-public.pem "$derived_public_key"
          openssl pkeyutl -sign -rawin -inkey "$signing_key" -in "$manifest" -out "$release_dir/ki-checksums.txt.sig"
          gh release view "$VERSION" >/dev/null 2>&1 && {
            printf 'ki release: release already exists: %s\n' "$VERSION" >&2
            exit 2
          }
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --generate-notes
      - name: Upload and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release_dir=dist/release-assets
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release upload "$VERSION" \
            "$release_dir"/ki-"$VERSION"-darwin-arm64.tar.gz \
            "$release_dir"/ki-"$VERSION"-darwin-x64.tar.gz \
            "$release_dir"/ki-"$VERSION"-linux-x64.tar.gz \
            "$release_dir"/ki-checksums.txt \
            "$release_dir"/ki-checksums.txt.sig
          gh release download "$VERSION" --dir "$verify_dir" --pattern 'ki-*'
          test "$(find "$verify_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          cmp "$release_dir/ki-checksums.txt" "$verify_dir/ki-checksums.txt"
          cmp "$release_dir/ki-checksums.txt.sig" "$verify_dir/ki-checksums.txt.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey release/ki-release-signing-public.pem \
            -in "$verify_dir/ki-checksums.txt" -sigfile "$verify_dir/ki-checksums.txt.sig"
          (
            cd "$verify_dir"
            tail -n +3 ki-checksums.txt | shasum -a 256 --check --strict
          )
          gh release edit "$VERSION" --draft=false --latest
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.immutable')
          test "$immutable" = true || {
            printf 'ki release: published release is not immutable\n' >&2
            exit 1
          }

  verify-release-install:
    needs: [validate, publish]
    name: Verify clean Linux release installation
    runs-on: ubuntu-latest
    steps:
      - name: Install and bootstrap the exact immutable release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output install.sh "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$VERSION/install.sh"
          export HOME="$work/home"
          export KI_CLI_INSTALL_DIR="$work/bin"
          export KI_MAN_INSTALL_DIR="$work/man/man1"
          export KI_DATA_HOME="$work/data"
          export KI_CONFIG_HOME="$work/config"
          export KI_CACHE_HOME="$work/cache"
          export KI_STATE_HOME="$work/state"
          mkdir -p "$HOME"
          bash ./install.sh "$VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${VERSION#v}"
          ki diag | grep -F "Executable    $KI_CLI_INSTALL_DIR/ki"
          ki bootstrap
          ki diag | grep -F 'Status        valid'
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
