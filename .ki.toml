# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/tools-ki"
title = "tools-ki"
description = "Knowledge Islands command-line interface."
repo_code = "KI-TOOL"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-tools]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-self]

[skills.ki-specs]

[skills.ki-guides]

[skills.ki-engineering]

[skills.ki-decision-records]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["cli", "cross-repository-vendoring"]
areas.CLI = "cli"
areas.VENDOR = "cross-repository-vendoring"

[skills.ki-tokenomics]

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-git]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
routes."knowledgeislands/ki-agentic-harness" = { import = ["work", "knowledge"] }
routes."knowledgeislands/ki-techne-principal" = { import = ["work", "knowledge"] }
routes."knowledgeislands/homebrew-tap" = { export = ["work"] }
routes."knowledgeislands/tools-mgit" = { export = ["work", "knowledge"], import = ["work", "knowledge"] }
routes."krisb/dotfiles" = { export = ["work", "knowledge"], import = ["work", "knowledge"] }

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
memberships.ki-tools = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
